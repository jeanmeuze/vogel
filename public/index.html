<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1c5a3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wie ben ik?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2c0 10-2 20-4 28-4 14-6 24-2 30 3 3 10 3 13 0 4-6 2-16-2-30-2-8-4-18-5-28z' fill='%23c9a15a' stroke='%237a5a2a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="8" height="8" fill="#c9a15a"/>
        <path d="M0 2h8M0 6h8" stroke="#a37c3c" stroke-width="1.6"/>
        <path d="M2 0v8M6 0v8" stroke="#dcb978" stroke-width="1" opacity=".7"/>
      </pattern>
      <symbol id="nest" viewBox="0 0 80 220">
        <path d="M40 0 C40 14 38 26 37 34" stroke="#7a5a2a" stroke-width="3" fill="none"/>
        <path d="M34 30 C33 60 26 96 20 128 C14 162 16 196 36 206 C52 213 66 200 66 172 C66 140 58 104 50 70 C46 54 44 40 44 30 Z" fill="url(#weave)" stroke="#7a5a2a" stroke-width="2.2"/>
        <path d="M24 150 C36 156 52 156 64 150 M22 120 C36 126 50 126 60 120" stroke="#8a6630" stroke-width="1.5" fill="none" opacity=".6"/>
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- FIRST VISIT: NAME -->
    <section id="welcome" class="screen">
      <svg class="nest-hang" aria-hidden="true"><use href="#nest"/></svg>
      <div class="intro-inner">
        <h1 class="title">Wie<br>ben ik?</h1>
        <p class="lead">Vlieg zo ver als ge kunt.<br>Hoe verder ge geraakt, hoe meer ge over mij te weten komt…</p>
        <form id="nameForm" class="join">
          <label for="nameInput" class="lbl">Hoe heet ge?</label>
          <input id="nameInput" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="Uw naam" required>
          <button class="btn primary" type="submit">Let's go!</button>
        </form>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div id="hintCard" class="hint-card hidden"><div class="hint-art"></div></div>
        <div class="hud-right">
          <div class="pill score-pill"><span id="score">0</span></div>
          <button id="muteBtn" class="pill small icon-btn" aria-label="Geluid">🔊</button>
          <button id="boardBtn" class="pill small icon-btn" aria-label="Scorebord">🏆</button>
        </div>
      </div>
      <div id="songNote" class="song-note hidden">♪</div>

      <div id="ready" class="ready">
        <div class="ready-card">
          <div class="ready-mode" id="readyMode"></div>
          <div id="modePick" class="mode-pick" role="radiogroup" aria-label="Moeilijkheid">
            <button data-pick="normal">Normaal</button>
            <button data-pick="hard">🔥 Hard</button>
            <button data-pick="nightmare">😈 Nightmare</button>
          </div>
          <div class="tap">Tik om te vliegen</div>
          <div class="best">Record: <b id="bestScore">0</b></div>
        </div>
      </div>

      <div id="over" class="sheet hidden">
        <div class="sheet-inner">
          <p id="overCause" class="cause"></p>
          <div class="big-score" id="overScore">0</div>
          <p class="muted" id="overMeta"></p>
          <p id="overBest" class="best-line"></p>
          <button id="againBtn" class="btn primary wide">Nog eens!</button>
          <button id="overBoardBtn" class="btn ghost wide">🏆 Scorebord</button>
        </div>
      </div>
      <div id="board" class="sheet board hidden">
        <div class="sheet-inner board-inner">
          <div class="board-head">
            <h2>🏆 Scorebord</h2>
            <button id="boardClose" class="board-x" aria-label="Sluiten">✕</button>
          </div>
          <div class="tabs" role="tablist">
            <button class="tab on" data-mode="all">Alles</button>
            <button class="tab" data-mode="hard">🔥 Hard</button>
            <button class="tab" data-mode="nm">😈 Nightmare</button>
            <button class="tab" data-mode="causes">💀 Oorzaken</button>
          </div>
          <div id="boardSub" class="tabs sub" role="tablist">
            <button class="tab on" data-view="best">Beste per speler</button>
            <button class="tab" data-view="top">Top 10 ooit</button>
          </div>
          <ol id="boardList" class="board-list"></ol>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/config.js"></script>
  <script src="/causes.js"></script>
  <script src="/audio.js"></script>
  <script src="/bird-art.js"></script>
  <script src="/game.js"></script>
  <script src="/app.js"></script>
</body>
</html>
