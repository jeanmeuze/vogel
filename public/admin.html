<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin · Wie ben ik?</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/causes.js"></script>
  <style>
    body { overflow: auto; -webkit-user-select: auto; user-select: auto; background: linear-gradient(180deg, #a9e2cf, #fff3d6) fixed; }
    .wrap { max-width: 900px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px 40px; }
    h1 { margin: 6px 0 4px; font-size: 26px; font-weight: 900; color: var(--leaf); }
    .sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 3px solid var(--leaf); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 30px; line-height: 1.1; }
    .stat span { font-size: 12px; font-weight: 800; color: var(--muted); }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .bar input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--leaf); font-size: 16px; font-weight: 700; }
    .bar .btn { padding: 8px 14px; font-size: 15px; }
    .list { display: grid; gap: 8px; }
    .u { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--card); border: 2px solid #cfe0c8; border-radius: 16px; padding: 10px 12px; }
    .u.nm { border-color: var(--evil); background: #fff3f5; }
    .u .name { font-weight: 900; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .u .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .seg { display: inline-flex; border: 2px solid var(--leaf); border-radius: 99px; overflow: hidden; }
    .seg button { border: 0; padding: 6px 10px; font-weight: 900; font-size: 13px; background: #fff; color: var(--leaf); cursor: pointer; }
    .seg button.on.norm { background: var(--leaf); color: #fff; }
    .seg button.on.evil { background: var(--evil); color: #fff; }
    .del { border: 0; background: none; color: #b23a2b; font-weight: 800; cursor: pointer; padding: 0; font-size: 12px; }
    .toggle-runs { border: 0; background: none; color: var(--leaf); font-weight: 900; cursor: pointer; padding: 0; font-size: 12px; text-decoration: underline; }
    .runs { grid-column: 1 / -1; display: none; margin-top: 4px; overflow-x: auto; }
    .u.open .runs { display: block; }
    .runs table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .runs th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; }
    .runs td { padding: 5px 6px; border-top: 1px solid #e3ecdf; font-weight: 700; white-space: nowrap; }
    .runs .none { color: var(--muted); font-weight: 700; padding: 6px; }
    .login { max-width: 340px; margin: 18vh auto 0; text-align: center; padding: 0 16px; }
    .login .hint { color: var(--muted); font-weight: 700; font-size: 14px; margin: 0; }
    .login input { width: 100%; text-align: center; font-size: 20px; padding: 12px; border-radius: 16px; border: 3px solid var(--leaf); margin: 12px 0 0; }
    .login .btn { margin-top: 12px; }
    .err { color: #b23a2b; font-weight: 800; min-height: 1.2em; }
    .empty { text-align: center; color: var(--muted); font-weight: 800; padding: 30px 0; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <h1>Admin</h1>
    <p id="loginHint" class="hint"></p>
    <form id="pwForm">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord">
      <input id="pw2" class="hidden" type="password" autocomplete="new-password" placeholder="Herhaal wachtwoord">
      <button id="pwBtn" class="btn primary wide">Binnen</button>
    </form>
    <p id="err" class="err"></p>
  </div>

  <div id="dash" class="wrap hidden">
    <h1>Spelers</h1>
    <p class="sub">😈 = stempel "nightmare only": die speler speelt altijd nightmare en kan het niet uitzetten.</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>spelers</span></div>
      <div class="stat"><b id="sNm">0</b><span>nightmare only</span></div>
      <div class="stat"><b id="sRuns">0</b><span>pogingen</span></div>
    </div>
    <div class="bar"><input id="q" placeholder="Zoek op naam…"><button id="refresh" class="btn primary">↻</button></div>
    <div id="list" class="list"></div>
  </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let pw = sessionStorage.getItem('admin_pw') || '', users = [], timer, setup = false;
  const open = new Set();
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ts = (t) => (t ? new Date(t).getTime() : 0);
  const ago = (t) => { t = ts(t); if (!t) return '–'; const s = (Date.now() - t) / 1000; return s < 60 ? 'net nu' : s < 3600 ? Math.round(s / 60) + ' min geleden' : s < 86400 ? Math.round(s / 3600) + ' u geleden' : new Date(t).toLocaleDateString('nl-BE'); };
  const when = (t) => new Date(t).toLocaleString('nl-BE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  async function api(method, body) {
    const r = await fetch('/api/admin/users', { method, headers: { 'x-admin-password': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    if (r.status === 401) throw new Error('pw');
    if (!r.ok) throw new Error('fout ' + r.status);
    return r.json();
  }
  async function load() {
    try { users = (await api('GET')).users; render(); }
    catch (e) { if (e.message === 'pw') logout('Verkeerd wachtwoord'); }
  }
  function runsTable(u) {
    if (!u.runs.length) return '<div class="none">Nog geen pogingen.</div>';
    return '<table><tr><th>Modus</th><th>Score</th><th>Doodsoorzaak</th><th>Tijd</th><th>Pluimen</th><th>Bomen</th><th>Wanneer</th></tr>' +
      u.runs.map((r) => `<tr><td>${r.nightmare ? '😈 nightmare' : 'normaal'}</td><td><b>${r.score}</b></td><td>${esc(causeLabel(r.cause))}</td><td>${r.seconds} s</td><td>${r.feathers}</td><td>${r.passed}</td><td>${when(r.at)}</td></tr>`).join('') +
      '</table>';
  }
  function render() {
    const q = $('#q').value.trim().toLowerCase();
    $('#sTotal').textContent = users.length;
    $('#sNm').textContent = users.filter((u) => u.nightmare).length;
    $('#sRuns').textContent = users.reduce((a, u) => a + u.runs.length, 0);
    const list = users.filter((u) => !q || (u.name || '').toLowerCase().includes(q));
    $('#list').innerHTML = list.map((u) => {
      const best = Math.max(0, ...u.runs.map((r) => r.score));
      const nmRuns = u.runs.filter((r) => r.nightmare);
      const bestNm = Math.max(0, ...nmRuns.map((r) => r.score));
      return `
      <div class="u ${u.nightmare ? 'nm' : ''} ${open.has(u.id) ? 'open' : ''}">
        <div class="name">${u.nightmare ? '😈 ' : ''}${esc(u.name)}</div>
        <div class="seg" data-id="${esc(u.id)}">
          <button class="norm ${u.nightmare ? '' : 'on'}" data-nm="0">Normaal</button>
          <button class="evil ${u.nightmare ? 'on' : ''}" data-nm="1">Nightmare only</button>
        </div>
        <div class="meta">
          <button class="toggle-runs" data-runs="${esc(u.id)}">${u.runs.length} pogingen ${open.has(u.id) ? '▴' : '▾'}</button>
          <span>${nmRuns.length} in nightmare</span><span>record ${best}</span><span>nightmare-record ${bestNm}</span>
          <span>laatst ${ago(u.lastSeen)}</span><span>sinds ${ago(u.createdAt)}</span>
          <button class="del" data-del="${esc(u.id)}" data-name="${esc(u.name)}">schrappen</button>
        </div>
        <div class="runs">${runsTable(u)}</div>
      </div>`;
    }).join('') || '<p class="empty">Nog geen spelers.</p>';
  }
  $('#list').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.runs) { open.has(b.dataset.runs) ? open.delete(b.dataset.runs) : open.add(b.dataset.runs); return render(); }
    if (b.dataset.del) {
      if (!confirm(b.dataset.name + ' schrappen, samen met alle pogingen? Dit kan niet ongedaan gemaakt worden.')) return;
      await api('DELETE', { id: b.dataset.del }); return load();
    }
    const seg = b.closest('.seg');
    if (seg && b.dataset.nm) { await api('PATCH', { id: seg.dataset.id, nightmare: b.dataset.nm === '1' }); load(); }
  });
  $('#q').addEventListener('input', render);
  $('#refresh').addEventListener('click', load);

  function start() {
    $('#login').classList.add('hidden'); $('#dash').classList.remove('hidden');
    load(); clearInterval(timer); timer = setInterval(load, 10000);
  }
  function setMode(isSetup) {
    setup = isSetup;
    $('#pw2').classList.toggle('hidden', !setup);
    $('#pw').autocomplete = setup ? 'new-password' : 'current-password';
    $('#pwBtn').textContent = setup ? 'Wachtwoord instellen' : 'Binnen';
    $('#loginHint').textContent = setup ? 'Eerste keer hier: kies een admin-wachtwoord (minstens 6 tekens).' : '';
  }
  function logout(msg) {
    clearInterval(timer); sessionStorage.removeItem('admin_pw'); pw = '';
    $('#dash').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#err').textContent = msg || '';
  }
  $('#pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = $('#pw').value;
    $('#err').textContent = '';
    if (setup && val.length < 6) { $('#err').textContent = 'Minstens 6 tekens.'; return; }
    if (setup && val !== $('#pw2').value) { $('#err').textContent = 'De twee wachtwoorden zijn niet gelijk.'; return; }
    try {
      const r = await fetch('/api/admin/auth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: val }) });
      if (r.status === 409) { setMode(false); $('#err').textContent = 'Er is al een wachtwoord ingesteld.'; return; }
      if (!r.ok) { $('#err').textContent = r.status === 401 ? 'Verkeerd wachtwoord' : 'Fout ' + r.status; return; }
      pw = val; sessionStorage.setItem('admin_pw', pw); setMode(false); start();
    } catch { $('#err').textContent = 'Geen verbinding'; }
  });
  (async () => {
    try { const r = await (await fetch('/api/admin/auth', { cache: 'no-store' })).json(); setMode(!!r.setup); } catch {}
    if (pw && !setup) start();
  })();
})();
</script>
</body>
</html>
