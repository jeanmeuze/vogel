<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin · Wie ben ik?</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { overflow: auto; -webkit-user-select: auto; user-select: auto; background: linear-gradient(180deg, #a9e2cf, #fff3d6) fixed; }
    .wrap { max-width: 900px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px 40px; }
    h1 { margin: 6px 0 4px; font-size: 26px; font-weight: 900; color: var(--leaf); }
    .sub { margin: 0 0 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 3px solid var(--leaf); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 30px; line-height: 1.1; }
    .stat span { font-size: 12px; font-weight: 800; color: var(--muted); }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .bar input { flex: 1; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--leaf); font-size: 16px; font-weight: 700; }
    .bar .btn { padding: 8px 14px; font-size: 15px; }
    .list { display: grid; gap: 8px; }
    .u { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--card); border: 2px solid #cfe0c8; border-radius: 16px; padding: 10px 12px; }
    .u.nm { border-color: var(--evil); background: #fff3f5; }
    .u .name { font-weight: 900; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .u .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .seg { display: inline-flex; border: 2px solid var(--leaf); border-radius: 99px; overflow: hidden; }
    .seg button { border: 0; padding: 6px 10px; font-weight: 900; font-size: 13px; background: #fff; color: var(--leaf); cursor: pointer; }
    .seg button.on.norm { background: var(--leaf); color: #fff; }
    .seg button.on.evil { background: var(--evil); color: #fff; }
    .del { border: 0; background: none; color: #b23a2b; font-weight: 800; cursor: pointer; padding: 0; font-size: 12px; }
    .warn { background: #fff4d6; border: 2px solid #f0c24a; border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .login { max-width: 340px; margin: 18vh auto 0; text-align: center; padding: 0 16px; }
    .login input { width: 100%; text-align: center; font-size: 26px; letter-spacing: .3em; padding: 12px; border-radius: 16px; border: 3px solid var(--leaf); margin: 12px 0; }
    .err { color: #b23a2b; font-weight: 800; min-height: 1.2em; }
    .empty { text-align: center; color: var(--muted); font-weight: 800; padding: 30px 0; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <h1>Admin</h1>
    <form id="pinForm"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn primary wide">Binnen</button></form>
    <p id="err" class="err"></p>
  </div>

  <div id="dash" class="wrap hidden">
    <h1>Spelers</h1>
    <p class="sub">Nightmare verplicht = speler kan het niet uitschakelen.</p>
    <div id="storeWarn" class="warn hidden">⚠️ Opslag staat op <b>geheugen</b>. Op Vercel is dat niet betrouwbaar (elke serverless instance heeft eigen geheugen). Koppel Upstash Redis of later een database, zie README.</div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>spelers</span></div>
      <div class="stat"><b id="sNm">0</b><span>nightmare verplicht</span></div>
      <div class="stat"><b id="sRuns">0</b><span>runs gespeeld</span></div>
    </div>
    <div class="bar"><input id="q" placeholder="Zoek op naam…"><button id="refresh" class="btn primary">↻</button></div>
    <div id="list" class="list"></div>
  </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let pin = sessionStorage.getItem('admin_pin') || '', users = [], timer;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = (t) => { if (!t) return '–'; const s = (Date.now() - t) / 1000; return s < 60 ? 'net nu' : s < 3600 ? Math.round(s / 60) + ' min geleden' : s < 86400 ? Math.round(s / 3600) + ' u geleden' : new Date(t).toLocaleDateString('nl-BE'); };

  async function api(method, body) {
    const r = await fetch('/api/admin/users', { method, headers: { 'x-pin': pin, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    if (r.status === 401) throw new Error('pin');
    if (!r.ok) throw new Error('fout ' + r.status);
    return r.json();
  }
  async function load() {
    try {
      const r = await api('GET');
      users = r.users;
      $('#storeWarn').classList.toggle('hidden', r.store !== 'memory');
      render();
    } catch (e) { if (e.message === 'pin') logout('Verkeerde PIN (of ADMIN_PIN niet ingesteld)'); }
  }
  function render() {
    const q = $('#q').value.trim().toLowerCase();
    $('#sTotal').textContent = users.length;
    $('#sNm').textContent = users.filter((u) => u.nightmare).length;
    $('#sRuns').textContent = users.reduce((a, u) => a + (u.runs || 0), 0);
    const list = users.filter((u) => !q || (u.name || '').toLowerCase().includes(q));
    $('#list').innerHTML = list.map((u) => `
      <div class="u ${u.nightmare ? 'nm' : ''}">
        <div class="name">${u.nightmare ? '😈 ' : ''}${esc(u.name)}</div>
        <div class="seg" data-id="${esc(u.id)}">
          <button class="norm ${u.nightmare ? '' : 'on'}" data-nm="0">Normaal</button>
          <button class="evil ${u.nightmare ? 'on' : ''}" data-nm="1">Nightmare</button>
        </div>
        <div class="meta">
          <span>${u.runs || 0} runs</span><span>record ${u.best || 0}</span><span>nightmare-record ${u.bestNightmare || 0}</span>
          <span>laatst ${ago(u.lastSeen)}</span><span>sinds ${ago(u.createdAt)}</span>
          <button class="del" data-del="${esc(u.id)}">verwijderen</button>
        </div>
      </div>`).join('') || '<p class="empty">Nog geen spelers.</p>';
  }
  $('#list').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.del) {
      if (!confirm('Speler verwijderen? Bij een volgend bezoek wordt die opnieuw aangemaakt.')) return;
      await api('DELETE', { id: b.dataset.del }); return load();
    }
    const seg = b.closest('.seg');
    if (seg && b.dataset.nm) { await api('PATCH', { id: seg.dataset.id, nightmare: b.dataset.nm === '1' }); load(); }
  });
  $('#q').addEventListener('input', render);
  $('#refresh').addEventListener('click', load);
  function start() {
    $('#login').classList.add('hidden'); $('#dash').classList.remove('hidden');
    load(); clearInterval(timer); timer = setInterval(load, 5000);
  }
  function logout(msg) {
    clearInterval(timer); sessionStorage.removeItem('admin_pin'); pin = '';
    $('#dash').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#err').textContent = msg || '';
  }
  $('#pinForm').addEventListener('submit', async (e) => {
    e.preventDefault(); pin = $('#pin').value.trim();
    try { await api('GET'); sessionStorage.setItem('admin_pin', pin); start(); } catch { logout('Verkeerde PIN (of ADMIN_PIN niet ingesteld)'); }
  });
  if (pin) start();
})();
</script>
</body>
</html>
